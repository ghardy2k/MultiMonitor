<html lang="en">
<head>

<meta name="description" content="Portable multi-machine Windows performance dashboard">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d5efc'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M5 18h5l3-8 5 14 3-6h6' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ------------------------------------------------------------------ tokens */
:root {
  color-scheme: light;
  --bg: #eef1f8;
  --bg-glow-1: rgba(109, 94, 252, .16);
  --bg-glow-2: rgba(34, 211, 238, .14);
  --bg-glow-3: rgba(244, 114, 182, .10);
  --surface: #ffffff;           /* chart surface (palette validated against it) */
  --surface-2: #f5f7fc;
  --surface-3: #eceff7;
  --glass: rgba(255, 255, 255, .72);
  --text-1: #10131c;
  --text-2: #4b5468;
  --muted: #737b90;
  --grid: #e6e9f1;
  --axis: #c5cad6;
  --border: rgba(16, 19, 28, .09);
  --border-strong: rgba(16, 19, 28, .16);
  --shadow: 0 1px 2px rgba(16, 19, 28, .05), 0 8px 24px -12px rgba(40, 50, 90, .18);
  --accent-1: #6d5efc;
  --accent-2: #22b8e0;
  --accent-3: #e2589e;
  --accent-grad: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  --ring: rgba(109, 94, 252, .45);
  --ok-text: #006300;
  --bad-text: #b42323;

  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;

  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;

  --radius: 16px;
  --radius-sm: 10px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #080c18;
    --bg-glow-1: rgba(109, 94, 252, .26);
    --bg-glow-2: rgba(34, 211, 238, .14);
    --bg-glow-3: rgba(226, 88, 158, .12);
    --surface: #141a2e;
    --surface-2: #1a2139;
    --surface-3: #222a46;
    --glass: rgba(12, 17, 33, .72);
    --text-1: #f3f5fb;
    --text-2: #b7bfd3;
    --muted: #8189a3;
    --grid: #222a44;
    --axis: #353f60;
    --border: rgba(255, 255, 255, .08);
    --border-strong: rgba(255, 255, 255, .16);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -16px rgba(0, 0, 0, .7);
    --ring: rgba(139, 128, 255, .6);
    --ok-text: #2fc02f;
    --bad-text: #ff7b7b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #080c18;
  --bg-glow-1: rgba(109, 94, 252, .26);
  --bg-glow-2: rgba(34, 211, 238, .14);
  --bg-glow-3: rgba(226, 88, 158, .12);
  --surface: #141a2e;
  --surface-2: #1a2139;
  --surface-3: #222a46;
  --glass: rgba(12, 17, 33, .72);
  --text-1: #f3f5fb;
  --text-2: #b7bfd3;
  --muted: #8189a3;
  --grid: #222a44;
  --axis: #353f60;
  --border: rgba(255, 255, 255, .08);
  --border-strong: rgba(255, 255, 255, .16);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -16px rgba(0, 0, 0, .7);
  --ring: rgba(139, 128, 255, .6);
  --ok-text: #2fc02f;
  --bad-text: #ff7b7b;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}

/* ------------------------------------------------------------------ base */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 14px/1.45 var(--font);
  color: var(--text-1);
  background:
    radial-gradient(1100px 620px at 8% -12%, var(--bg-glow-1), transparent 62%),
    radial-gradient(900px 520px at 100% -4%, var(--bg-glow-2), transparent 60%),
    radial-gradient(900px 700px at 55% 118%, var(--bg-glow-3), transparent 62%),
    var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------------------------------------------ layout */
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); grid-template-rows: auto 1fr; min-height: 100vh; }
.topbar {
  grid-column: 1 / -1; position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 18px; background: var(--glass);
  backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
.brand-logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent-grad); display: grid; place-items: center; box-shadow: 0 6px 18px -6px var(--accent-1); }
.brand-logo svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.brand-name { font-weight: 700; font-size: 17px; letter-spacing: -.01em; background: linear-gradient(90deg, var(--text-1), var(--accent-1) 70%, var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cfg-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
.cfg-name input { border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 4px 8px; font-weight: 600; width: 220px; max-width: 32vw; text-overflow: ellipsis; }
.cfg-name input:hover { border-color: var(--border); }
.cfg-name input:focus { border-color: var(--ring); background: var(--surface); outline: none; }
.dirty { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-3); display: none; }
.dirty.on { display: inline-block; }
.spacer { flex: 1; }
.tb-group { display: flex; align-items: center; gap: 6px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
  border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface);
  color: var(--text-1); font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { border-color: transparent; background: var(--accent-grad); color: #fff; box-shadow: 0 6px 18px -8px var(--accent-1); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-3); }
.btn.icon { width: 34px; padding: 0; justify-content: center; }
.btn.sm { height: 28px; padding: 0 9px; font-size: 13px; border-radius: 8px; }
.btn.sm.icon { width: 28px; padding: 0; }
.btn.danger { color: var(--bad-text); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
select.sel, input.inp, textarea.inp {
  height: 34px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface);
  padding: 0 10px;
}
textarea.inp { height: auto; padding: 8px 10px; resize: vertical; }
select.sel:focus, input.inp:focus, textarea.inp:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 35%, transparent); }

.pill { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); font-size: 13px; font-weight: 600; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.live .dot { background: var(--good); box-shadow: 0 0 0 0 rgba(12, 163, 12, .6); animation: pulse 2s infinite; }
.pill.demo .dot { background: var(--warning); }
.pill.off .dot { background: var(--critical); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(12,163,12,.55); } 70% { box-shadow: 0 0 0 7px rgba(12,163,12,0); } 100% { box-shadow: 0 0 0 0 rgba(12,163,12,0); } }
@media (prefers-reduced-motion: reduce) { .pill.live .dot { animation: none; } }

/* ------------------------------------------------------------------ sidebar */
.sidebar { border-right: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 55%, transparent); display: flex; flex-direction: column; min-height: 0; position: sticky; top: 55px; height: calc(100vh - 55px); overflow: auto; }
.side-sec { padding: 14px 14px 6px; }
.side-title { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 4px 8px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 12px;
  border: 1px solid transparent; background: transparent; text-align: left; color: var(--text-1);
}
.nav-item:hover { background: var(--surface-3); }
.nav-item.active { background: var(--surface); border-color: var(--border-strong); box-shadow: var(--shadow); }
.nav-item .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .txt { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.nav-item .spark { width: 64px; height: 24px; flex: none; }
.mchip { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.sdot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
.sdot.ok { background: var(--good); } .sdot.partial { background: var(--warning); } .sdot.error { background: var(--critical); } .sdot.loading { background: var(--accent-2); }

.picker-search { position: relative; margin: 0 2px 8px; }
.picker-search input { width: 100%; padding-left: 32px; }
.picker-search svg { position: absolute; left: 10px; top: 9px; color: var(--muted); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 2px 10px; }
.cat { margin-bottom: 4px; border-radius: 12px; }
.cat > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px; }
.cat > summary::-webkit-details-marker { display: none; }
.cat > summary:hover { background: var(--surface-3); }
.cat > summary .chev { transition: transform .15s; color: var(--muted); }
.cat[open] > summary .chev { transform: rotate(90deg); }
.cat > summary .cnt { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--muted); background: var(--surface-3); border-radius: 999px; padding: 1px 8px; }
.cat > summary .cnt.on { color: #fff; background: var(--accent-1); }
.metric-opt { display: flex; align-items: flex-start; gap: 9px; padding: 6px 8px 6px 12px; border-radius: 9px; cursor: pointer; font-size: 13px; }
.metric-opt:hover { background: var(--surface-3); }
.metric-opt input { margin-top: 3px; accent-color: var(--accent-1); }
.metric-opt .d { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.metric-opt .del { margin-left: auto; }
.side-foot { margin-top: auto; padding: 12px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }

/* ------------------------------------------------------------------ main */
main { padding: 22px clamp(16px, 2.4vw, 32px) 48px; min-width: 0; }
.banner { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 14px; margin-bottom: 18px; border: 1px solid color-mix(in srgb, var(--warning) 45%, transparent); background: linear-gradient(90deg, color-mix(in srgb, var(--warning) 16%, var(--surface)), var(--surface)); }
.banner svg { color: var(--warning); }
.banner .t { flex: 1; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; line-height: 1.15; }
.page-head .sub { color: var(--text-2); margin-top: 4px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.page-head .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.sec-title { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 26px 2px 12px; display: flex; align-items: center; gap: 10px; }
.sec-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-strong), transparent); }

.card {
  position: relative; border-radius: var(--radius); padding: 16px;
  background:
    linear-gradient(var(--surface), var(--surface)) padding-box,
    linear-gradient(140deg, color-mix(in srgb, var(--accent-1) 45%, var(--border-strong)), var(--border) 38%, var(--border) 62%, color-mix(in srgb, var(--accent-2) 40%, var(--border-strong))) border-box;
  border: 1px solid transparent; box-shadow: var(--shadow); min-width: 0;
}
.card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 70px; border-radius: var(--radius) var(--radius) 0 0; background: linear-gradient(180deg, color-mix(in srgb, var(--accent-1) 6%, transparent), transparent); pointer-events: none; }

/* sysinfo strip */
.sysgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.sysitem { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); min-width: 0; }
.sysitem .k { font-size: 12px; color: var(--muted); }
.sysitem .v { font-weight: 600; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meter { height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--s1) 18%, var(--surface-3)); overflow: hidden; margin-top: 8px; }
.meter > i { display: block; height: 100%; border-radius: 999px; background: var(--s1); }
.meter.warning > i { background: var(--warning); } .meter.critical > i { background: var(--critical); }

/* KPI tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.tile { padding: 14px 16px 12px; overflow: hidden; }
.tile .bar { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--accent-grad); opacity: .85; border-radius: var(--radius) var(--radius) 0 0; }
.tile.warning .bar { background: var(--warning); } .tile.critical .bar { background: var(--critical); } .tile.good .bar { background: var(--good); }
.tile .lbl { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .val { font-size: 28px; font-weight: 650; letter-spacing: -.02em; margin-top: 4px; line-height: 1.1; white-space: nowrap; }
.tile .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: 6px; }
.tile .delta { font-size: 12px; color: var(--muted); white-space: nowrap; }
.tile .delta.good { color: var(--ok-text); } .tile .delta.bad { color: var(--bad-text); }
.tile .spark { width: 96px; height: 30px; flex: none; }
.tile.na .val { font-size: 15px; color: var(--muted); font-weight: 500; }

.status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.status svg { width: 14px; height: 14px; }
.status.good svg { color: var(--good); } .status.warning svg { color: var(--warning); } .status.critical svg { color: var(--critical); }

/* chart cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.card.wide { grid-column: 1 / -1; }
.card-head { display: flex; align-items: flex-start; gap: 10px; position: relative; }
.card-head h3 { margin: 0; font-size: 15px; font-weight: 650; }
.card-head .meta { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-head .ttl { min-width: 0; flex: 1; }
.card-head .acts { display: flex; gap: 2px; opacity: .75; }
.card:hover .card-head .acts, .card:focus-within .card-head .acts { opacity: 1; }
.drag { cursor: grab; color: var(--muted); padding: 4px 0; }
.card.dragging { opacity: .45; }
.card.drop-before { box-shadow: -4px 0 0 0 var(--accent-1), var(--shadow); }
.chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); vertical-align: 2px; margin-left: 6px; }
.chip.cim { background: color-mix(in srgb, var(--accent-2) 22%, var(--surface-3)); }
.card-kpi { display: flex; align-items: center; gap: 14px; margin: 12px 0 6px; position: relative; }
.card-kpi .big { font-size: 30px; font-weight: 650; letter-spacing: -.02em; line-height: 1; }
.card-kpi .gauge { width: 118px; height: 70px; flex: none; }
.card-kpi .kv { display: flex; flex-direction: column; gap: 6px; }
.chart { position: relative; height: 190px; outline: none; border-radius: 10px; touch-action: pan-y; }
.card.wide .chart { height: 240px; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.chart:focus-visible { box-shadow: 0 0 0 2px var(--ring); }
.chart .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 0 20px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 12px; color: var(--text-2); }
.legend .k { display: inline-flex; align-items: center; gap: 6px; max-width: 220px; }
.legend .k span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend .ln { width: 14px; height: 3px; border-radius: 2px; flex: none; }
.legend .more { color: var(--muted); font-style: italic; }
.card-error { margin-top: 12px; padding: 14px; border-radius: 12px; background: var(--surface-2); color: var(--text-2); font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.card-error svg { color: var(--muted); margin-top: 2px; }
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
.table-wrap { max-height: 240px; overflow: auto; margin-top: 8px; border-radius: 8px; }

/* overview */
.fleet { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 16px; }
.mcard { cursor: pointer; transition: transform .15s, box-shadow .15s; }
.mcard:hover { transform: translateY(-2px); }
.mcard .mh { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.mcard .mh .nm { font-weight: 650; font-size: 15px; }
.mcard .mh .host { font-size: 12px; color: var(--muted); }
.mcard .mh .st { margin-left: auto; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto 76px 18px; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13px; }
.mrow .l { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .v { font-weight: 600; white-space: nowrap; }
.mrow .spark { width: 76px; height: 22px; }
.mrow .status svg { width: 16px; height: 16px; }
.mcard .err { color: var(--text-2); font-size: 13px; padding: 8px 0; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 4px; }
.stat .lbl { font-size: 13px; color: var(--text-2); }
.stat .val { font-size: 34px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; }
.stat .val small { font-size: 14px; color: var(--muted); font-weight: 500; }

.empty-state { text-align: center; padding: 60px 20px; }
.empty-state .ic { width: 64px; height: 64px; border-radius: 18px; background: var(--accent-grad); display: grid; place-items: center; margin: 0 auto 16px; box-shadow: 0 12px 30px -10px var(--accent-1); }
.empty-state .ic svg { width: 32px; height: 32px; color: #fff; }
.empty-state h2 { margin: 0 0 6px; }
.empty-state p { color: var(--text-2); max-width: 460px; margin: 0 auto 18px; }

/* tooltip / menus / dialogs / toasts */
#tooltip { position: fixed; z-index: 100; pointer-events: none; min-width: 150px; max-width: 320px; padding: 9px 11px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: 0 12px 32px -8px rgba(0,0,0,.35); font-size: 12.5px; display: none; }
#tooltip .tt { color: var(--muted); font-size: 11.5px; margin-bottom: 5px; }
#tooltip .r { display: grid; grid-template-columns: 14px auto minmax(0, 1fr); align-items: center; gap: 7px; padding: 1px 0; }
#tooltip .r b { font-weight: 650; font-variant-numeric: tabular-nums; }
#tooltip .r span { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tooltip .ln { width: 14px; height: 3px; border-radius: 2px; }
.menu { position: fixed; z-index: 90; min-width: 200px; padding: 6px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: 0 16px 40px -12px rgba(0,0,0,.4); }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
.menu button:hover, .menu button:focus-visible { background: var(--surface-3); outline: none; }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 5px 4px; }
.menu .danger { color: var(--bad-text); }
dialog { border: 0; padding: 0; border-radius: 18px; background: var(--surface); color: var(--text-1); box-shadow: 0 30px 80px -20px rgba(0,0,0,.55); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog.wide { width: min(900px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(6, 9, 20, .55); backdrop-filter: blur(3px); }
.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
.dlg-head { padding: 18px 20px 0; display: flex; align-items: center; gap: 10px; }
.dlg-head h2 { margin: 0; font-size: 18px; flex: 1; }
.dlg-body { padding: 16px 20px; overflow: auto; }
.dlg-foot { padding: 14px 20px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--border); flex-wrap: wrap; }
.dlg-foot .left { margin-right: auto; display: flex; align-items: center; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--muted); }
.field .inp, .field .sel { width: 100%; }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 10px; padding: 2px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; font-weight: 500; }
.seg button.on { background: var(--surface); box-shadow: var(--shadow); font-weight: 650; }
details.adv > summary { cursor: pointer; color: var(--text-2); font-weight: 600; margin-bottom: 12px; }
.test-result { font-size: 13px; }
.test-result.ok { color: var(--ok-text); } .test-result.bad { color: var(--bad-text); }
.set-list { border: 1px solid var(--border); border-radius: 12px; max-height: 52vh; overflow: auto; }
.set-list details { border-bottom: 1px solid var(--border); }
.set-list summary { padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: 13px; }
.set-list summary .d { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.set-list .p { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 22px; font-size: 12.5px; }
.set-list .p:hover { background: var(--surface-3); }
.set-list .p .mono { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cfg-list button { display: flex; width: 100%; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); margin-bottom: 8px; text-align: left; }
.cfg-list button:hover { border-color: var(--ring); }
#toasts { position: fixed; right: 18px; bottom: 18px; z-index: 110; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 10px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: 0 12px 30px -10px rgba(0,0,0,.4); display: flex; align-items: center; gap: 10px; max-width: 380px; animation: tin .2s ease-out; }
.toast.ok svg { color: var(--good); } .toast.err svg { color: var(--critical); } .toast.info svg { color: var(--accent-1); }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
.drop-overlay { position: fixed; inset: 0; z-index: 120; display: none; place-items: center; background: color-mix(in srgb, var(--accent-1) 18%, rgba(0,0,0,.4)); backdrop-filter: blur(2px); color: #fff; font-size: 22px; font-weight: 700; }
.drop-overlay.on { display: grid; }
.drop-overlay div { padding: 30px 40px; border: 2px dashed #fff; border-radius: 20px; }
.refetch .chart svg.base { transition: opacity .2s; }

.menu-toggle { display: none; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 60; width: min(320px, 88vw); height: 100vh; transform: translateX(-100%); transition: transform .2s; background: var(--surface); box-shadow: var(--shadow); }
  .sidebar.open { transform: none; }
  .menu-toggle { display: inline-flex; }
  .cfg-name input { width: 150px; }
  .tb-hide-sm { display: none !important; }
  .frow { grid-template-columns: 1fr; }
}
@media (forced-colors: active) {
  .card { border: 1px solid CanvasText; }
  .legend .ln, #tooltip .ln { forced-color-adjust: none; }
}
@media print {
  .topbar, .sidebar, .card-head .acts, .banner { display: none !important; }
  .app { display: block; }
  body { background: #fff; }
}

/** Validate + normalise anything loaded from disk, the agent or localStorage. */
function normalizeConfig(raw) {

  if (raw.schema && raw.schema !== SCHEMA) throw new Error(`Unknown schema "${raw.schema}".`);
  if (!Array.isArray(raw.machines)) throw new Error('Missing "machines" array - is this a MultiMonitor config?');
  const str = (v, d = '', max = 300) => typeof v === 'string' ? v.slice(0, max) : d;
  const num = (v, d, lo, hi) => isNum(+v) && v !== '' && v !== null ? clamp(+v, lo, hi) : d;
  const s = Object.assign(defaultSettings(), raw.settings || {});
  const settings = {
    mode: ['auto', 'live', 'demo'].includes(s.mode) ? s.mode : 'auto',
    hubUrl: str(s.hubUrl).trim(), hubKey: str(s.hubKey),
    refreshSec: REFRESHES.includes(+s.refreshSec) ? +s.refreshSec : num(s.refreshSec, 5, 1, 3600),
    windowMin: WINDOWS.includes(+s.windowMin) ? +s.windowMin : 5,
    theme: ['auto', 'light', 'dark'].includes(s.theme) ? s.theme : 'auto',
  };
  const customMetrics = (Array.isArray(raw.customMetrics) ? raw.customMetrics : []).filter(c => c && typeof c.path === 'string' && c.path.startsWith('\\')).map(c => ({
    id: /^custom\.[A-Za-z0-9_-]{1,40}$/.test(c.id) ? c.id : 'custom.' + hashStr(c.path).toString(36),
    cat: 'custom', label: str(c.label, c.path, 120) || c.path, path: str(c.path, '', 400),
    unit: UNITS[c.unit] ? c.unit : 'count', multi: c.path.includes('*'), exclude: c.path.includes('*') ? ['_total', '__total__', '_global_'] : undefined,
    agg: ['sum', 'avg', 'max', 'min'].includes(c.agg) ? c.agg : 'sum', dir: c.dir === 'below' ? 'below' : 'above',
    max: isNum(c.max) ? c.max : (c.unit === 'pct' ? 100 : undefined),
    warn: isNum(c.warn) ? c.warn : undefined, crit: isNum(c.crit) ? c.crit : undefined, desc: str(c.desc, 'Custom counter', 300),
  }));
  const known = id => CATALOG_BY_ID.has(id) || customMetrics.some(c => c.id === id);
  const seenIds = new Set();
  const machines = raw.machines.filter(m => m && typeof m === 'object').slice(0, 64).map((m, i) => {
    let id = /^[A-Za-z0-9_-]{1,40}$/.test(m.id) ? m.id : uid('m');
    if (seenIds.has(id)) id = uid('m');
    seenIds.add(id);
    const thresholds = {};
    for (const [k, t] of Object.entries(m.thresholds || {})) {
      if (known(k) && t && typeof t === 'object') thresholds[k] = { warn: isNum(t.warn) ? t.warn : null, crit: isNum(t.crit) ? t.crit : null };
    }
    const layout = {};
    for (const [k, l] of Object.entries(m.layout || {})) if (known(k) && l && typeof l === 'object') layout[k] = { wide: !!l.wide, table: !!l.table };
    const host = str(m.host, 'localhost', 255).trim();
    return {
      id, name: str(m.name, host || 'Machine', 80) || host || 'Machine', host,
      agentUrl: str(m.agentUrl).trim(), apiKey: str(m.apiKey),
      colorSlot: Number.isInteger(m.colorSlot) ? clamp(m.colorSlot, 0, SERIES_SLOTS - 1) : i % SERIES_SLOTS,
      roles: Array.isArray(m.roles) ? m.roles.filter(r => typeof r === 'string').slice(0, 8) : [],
      metrics: [...new Set((Array.isArray(m.metrics) ? m.metrics : []).filter(x => typeof x === 'string' && known(x)))],
      thresholds, layout,
    };
  });
  const view = typeof raw.view === 'string' && (raw.view === 'overview' || machines.some(m => m.id === raw.view)) ? raw.view : 'overview';
  return { schema: SCHEMA, version: 1, name: str(raw.name, 'Dashboard', 80) || 'Dashboard', settings, customMetrics, machines, view };
}
function serializeConfig() {
  const out = {
    schema: SCHEMA, version: 1, app: `MultiMonitor ${APP_VERSION}`, name: config.name, savedAt: new Date().toISOString(),
    settings: { ...config.settings },
    customMetrics: config.customMetrics.map(c => {
      const o = { id: c.id, label: c.label, path: c.path, unit: c.unit, agg: c.agg, dir: c.dir };
      if (isNum(c.max)) o.max = c.max; if (isNum(c.warn)) o.warn = c.warn; if (isNum(c.crit)) o.crit = c.crit;
      if (c.desc && c.desc !== 'Custom counter') o.desc = c.desc;
      return o;
    }),
    machines: config.machines.map(m => {
      const o = { id: m.id, name: m.name, host: m.host, colorSlot: m.colorSlot, metrics: [...m.metrics] };
      if (m.agentUrl) o.agentUrl = m.agentUrl;
      if (m.apiKey) o.apiKey = m.apiKey;
      if (m.roles.length) o.roles = [...m.roles];
      const th = Object.entries(m.thresholds).filter(([k]) => m.metrics.includes(k));
      if (th.length) o.thresholds = Object.fromEntries(th);
      const ly = Object.entries(m.layout).filter(([k, l]) => m.metrics.includes(k) && (l.wide || l.table));

/** Aggregated (single) series for a metric - used by tiles, gauges, overview. */
function aggSeries(h, def) {
  if (!h || !h.t.length) return [];
  if (!def.multi) { const s = h.series.values().next().value; return s ? s.pts : []; }
  const out = [];
  const lists = [...h.series.values()].map(s => s.pts);
  const idx = lists.map(() => 0);
  for (const t of h.t) {
    const vals = [];
    lists.forEach((pts, i) => {
      while (idx[i] < pts.length && pts[idx[i]][0] < t) idx[i]++;
      if (idx[i] < pts.length && pts[idx[i]][0] === t && isNum(pts[idx[i]][1])) vals.push(pts[idx[i]][1]);
    });
    let v = null;
    if (vals.length) {
      const a = def.agg || 'sum';
      v = a === 'avg' ? vals.reduce((x, y) => x + y, 0) / vals.length : a === 'max' ? Math.max(...vals) : a === 'min' ? Math.min(...vals) : vals.reduce((x, y) => x + y, 0);
    }

}

function ingest(m, r, t, results) {
  const sys = r.sys;
  let errors = 0, oks = 0;
  for (const id of m.metrics) {
    const def = metricDef(id);
    if (!def) continue;
    const res = results[def.path];
    const h = metricHist(r, id);
    if (!res) continue;
    if (!res.ok) { h.error = res.error || 'Counter unavailable.'; errors++; continue; }
    oks++;
    h.error = ''; h.source = res.source || 'pdh';
    const xf = def.xf ? XF[def.xf] : null;
    const excl = (def.exclude || []).map(s => s.toLowerCase());
    let vals = (res.values || []).filter(v => !def.multi || !excl.includes(String(v.instance).toLowerCase()));
    if (!def.multi) vals = vals.slice(0, 1);

      el('button', { class: 'btn', text: 'Cancel', onclick: () => dlg.close() }), el('button', { class: 'btn primary', text: 'Add to ' + m.name, onclick: add })] });
  if (preset.path) guessUnit();
}

async function browserDialog(m) {
  const search = el('input', { class: 'inp', type: 'search', placeholder: 'Filter sets and counters…  e.g. "web service", "queue", "sql"' });
  const list = el('div', { class: 'set-list' }, el('div', { class: 'muted', style: { padding: '16px' }, text: 'Loading counter sets from ' + m.host + '…' }));
  const inst = el('input', { class: 'inp mono', value: '*', style: { width: '130px' }, title: 'Instance to use for multi-instance sets' });
  openDialog({ title: `Counters on ${m.name}`, wide: true,
    body: el('div', {}, el('div', { style: { display: 'flex', gap: '10px', marginBottom: '12px', flexWrap: 'wrap', alignItems: 'center' } }, el('div', { style: { flex: '1', minWidth: '220px' } }, search), el('label', { class: 'muted', style: { fontSize: '13px' } }, 'Instance ', inst)), list),
    foot: [el('div', { class: 'left muted', style: { fontSize: '12px' }, text: 'Click “Add” to put a counter on the dashboard. Multi-instance sets use the instance box ( * = all, _Total = total ).' }), el('button', { class: 'btn', text: 'Close', onclick: () => dlg.close() })] });
  let sets;
  try {
    if (state.mode === 'demo' && !m.agentUrl) {
      sets = [...new Map(CATALOG.map(d => [d.path.match(/^\\([^\\(]+)/)[1], d])).keys()].map(name => ({ name, description: 'Demo counter set', multi: CATALOG.some(d => d.path.startsWith('\\' + name + '(')), paths: CATALOG.filter(d => d.path.match(/^\\([^\\(]+)/)[1] === name).map(d => d.path.replace(/\(([^)]*)\)/, '(*)')) }));
    } else {
      const res = await api(m, '/api/sets?computer=' + encodeURIComponent(m.host || 'localhost'), { timeout: 60000 });
      if (!res.ok) throw new Error(res.error);
      sets = res.sets;
    }
  } catch (e) { list.replaceChildren(el('div', { class: 'test-result bad', style: { padding: '16px' }, text: '✗ ' + e.message })); return; }
  const render = () => {
    const q = search.value.trim().toLowerCase();
    const frag = [];
    let shown = 0;
    for (const s of sets) {
      const setHit = !q || s.name.toLowerCase().includes(q) || (s.description || '').toLowerCase().includes(q);
      const paths = (s.paths || []).filter(p => setHit || p.toLowerCase().includes(q));
      if (!paths.length) continue;
      if (++shown > 120) break;
      const det = el('details', { open: q && paths.length < 25 ? true : undefined }, el('summary', {}, s.name, s.multi ? el('span', { class: 'chip', text: 'multi-instance' }) : null, el('span', { class: 'd', text: s.description || '' })));
      det.addEventListener('toggle', () => {
        if (!det.open || det.dataset.built) return;
        det.dataset.built = '1';
        for (const p of paths) {
          det.append(el('div', { class: 'p' }, el('span', { class: 'mono', text: p, title: p }),
            el('button', { class: 'btn sm', text: 'Add', onclick: () => {
              const finalPath = s.multi ? p.replace('(*)', '(' + (inst.value.trim() || '*') + ')') : p;
              customDialog(m, { path: finalPath, label: `${s.name}: ${p.split('\\').pop()}` });
            } })));
        }
      });
      if (det.open) det.dispatchEvent(new Event('toggle'));
      frag.push(det);
    }
    list.replaceChildren(...frag);
    if (!frag.length) list.append(el('div', { class: 'muted', style: { padding: '16px' }, text: 'No counters match.' }));
    if (shown > 120) list.append(el('div', { class: 'muted', style: { padding: '12px 16px' }, text: 'Showing the first 120 sets - refine the filter to see more.' }));
  };
  search.addEventListener('input', debounce(render, 150));
  render();
}

function settingsDialog() {
  const s = config.settings;
  let mode = s.mode;
  const seg = el('div', { class: 'seg', role: 'radiogroup' });
  const modes = [['auto', 'Automatic'], ['live', 'Live agent'], ['demo', 'Demo data']];
  const drawSeg = () => seg.replaceChildren(...modes.map(([k, l]) => el('button', { type: 'button', role: 'radio', 'aria-checked': String(mode === k), class: mode === k ? 'on' : '', text: l, onclick: () => { mode = k; drawSeg(); } })));
  drawSeg();
  const hub = el('input', { class: 'inp mono', value: s.hubUrl, placeholder: /^https?:$/.test(location.protocol) ? location.origin + ' (this page)' : 'http://localhost:8765', spellcheck: 'false' });
  const key = el('input', { class: 'inp mono', type: 'password', value: s.hubKey, autocomplete: 'off' });
  const refresh = el('select', { class: 'sel' }, REFRESHES.map(v => el('option', { value: v, text: `Every ${v} seconds`, selected: v === s.refreshSec || undefined })));
  const win = el('select', { class: 'sel' }, WINDOWS.map(v => el('option', { value: v, text: v === 60 ? 'Last hour' : `Last ${v} minute${v > 1 ? 's' : ''}`, selected: v === s.windowMin || undefined })));
  const theme = el('select', { class: 'sel' }, [['auto', 'Match system'], ['light', 'Light'], ['dark', 'Dark']].map(([k, l]) => el('option', { value: k, text: l, selected: k === s.theme || undefined })));
  const info = el('div', { class: 'muted', style: { fontSize: '13px' } });
  info.textContent = state.hubOk ? `Connected: agent ${state.hubInfo.version} on ${state.hubInfo.computer} as ${state.hubInfo.user}.` : `Not connected: ${state.hubError || 'no agent found'}.`;
  openDialog({ title: 'Settings',
    body: el('div', {}, field('Data source', seg, 'Automatic uses the agent when it answers and simulated data otherwise.'),
      field('Agent URL', hub, 'Where MultiMonitor.ps1 is listening. Leave empty when this page is served by the agent.'),
      field('Agent API key', key, 'Only needed when the agent was started with -ApiKey.'),
      el('div', { class: 'frow' }, field('Refresh', refresh), field('Time window', win)), field('Theme', theme), info),
    foot: [el('div', { class: 'left' }, el('button', { class: 'btn ghost', text: 'Clear chart history', onclick: () => { clearHistory(); dlg.close(); renderMain(); tick(); } })),
      el('button', { class: 'btn', text: 'Cancel', onclick: () => dlg.close() }),
      el('button', { class: 'btn primary', text: 'Save', onclick: () => {
        const hv = hub.value.trim();
        if (hv && !/^https?:\/\/[^\s/]+/i.test(hv)) { info.className = 'test-result bad'; info.textContent = '✗ Agent URL must start with http:// or https://'; return; }
        const reconnect = s.hubUrl !== hv || s.hubKey !== key.value || s.mode !== mode;
        Object.assign(s, { mode, hubUrl: hv, hubKey: key.value, refreshSec: +refresh.value, windowMin: +win.value, theme: theme.value });
        dlg.close(); markDirty(); applyTheme(); renderTopbar(); restartPolling(); renderMain();
        if (reconnect) checkHub();
      } })] });
}

function helpDialog() {
  const p = (...k) => el('p', {}, ...k);
  openDialog({ title: 'How MultiMonitor works', wide: true, body: el('div', {},
    p(el('b', { text: 'The agent. ' }), 'Browsers cannot read Windows performance counters, so MultiMonitor.ps1 (Windows PowerShell 5.1, no installs) serves this page and reads counters for it. Run it with ', el('span', { class: 'mono', text: 'powershell -ExecutionPolicy Bypass -File .\\MultiMonitor.ps1' }), ' then browse to http://localhost:8765.'),
    p(el('b', { text: 'Remote machines. ' }), 'The agent reads other computers with Get-Counter -ComputerName, as the account running it. That account must be in the target’s “Performance Monitor Users” group, and the Remote Registry service must be running there. Alternatively, run another agent on the target with -AllowRemote -ApiKey and set the machine’s Agent URL.'),
    p(el('b', { text: 'Configs. ' }), 'Save writes a .json file you can reopen later (or drag onto the page). “Save to agent” keeps it in the agent’s configs folder. Your last layout is also kept in this browser automatically.'),
    p(el('b', { text: 'Shortcuts. ' }), 'Ctrl+O open · Ctrl+S save · Ctrl+Shift+S save as · Space pause (when nothing is focused) · arrow keys inside a chart step through samples.'),
    p(el('b', { text: 'Fallback. ' }), 'If a machine’s counter registry is damaged, core metrics (CPU, memory, disk space, processes, uptime, TCP) are read via WMI/CIM instead and marked “via CIM”. Rebuild counters with ', el('span', { class: 'mono', text: 'lodctr /R' }), ' (elevated).')) });
}

/* ------------------------------------------------------------------ config I/O */
function loadConfigObject(obj, fileName = '', handle = null) {
  const c = normalizeConfig(obj);
  config = c;
  state.view = c.view;
  state.fileName = fileName; state.fileHandle = handle; state.dirty = false;
  rt.clear(); demoState.clear();
  applyTheme(); renderTopbar(); renderSidebar(); renderMain();
  restartPolling(); checkHub();
  autosave();
}
function loadConfigText(text, fileName, handle) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { throw new Error('The file is not valid JSON: ' + e.message); }
  loadConfigObject(obj, fileName, handle);
  toast(`Opened “${config.name}”${fileName ? ' from ' + fileName : ''}.`, 'ok');
}
async function guardUnsaved() { return !state.dirty || await confirmDialog('You have unsaved changes. Discard them?', 'Discard changes'); }
async function openConfigFile() {
  if (!await guardUnsaved()) return;
  if (window.showOpenFilePicker) {
    try {
      const [h] = await window.showOpenFilePicker({ types: [{ description: 'MultiMonitor config', accept: { 'application/json': ['.json'] } }] });
      const f = await h.getFile();
      loadConfigText(await f.text(), f.name, h);
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
      if (e.name !== 'SecurityError' && e.name !== 'TypeError') { toast(e.message, 'err'); return; }
    }
  }
  $('#fileInput').click();
}
$('#fileInput').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { loadConfigText(await f.text(), f.name, null); } catch (err) { toast(err.message, 'err'); }
});
async function saveConfig(saveAs = false) {
  const text = serializeConfig();
  if (!saveAs && state.fileHandle && state.fileHandle.createWritable) {
    try {
      const w = await state.fileHandle.createWritable(); await w.write(text); await w.close();
      savedOk(state.fileHandle.name); return;
    } catch (e) { if (e.name === 'AbortError') return; toast('Could not write the file: ' + e.message + ' - choose a location instead.', 'err'); }
  }
  const suggested = (state.fileName && !saveAs ? state.fileName : slug(config.name) + '.mmconfig.json');
  if (window.showSaveFilePicker) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: suggested, types: [{ description: 'MultiMonitor config', accept: { 'application/json': ['.json'] } }] });
      const w = await h.createWritable(); await w.write(text); await w.close();
      state.fileHandle = h; state.fileName = h.name; savedOk(h.name); return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = el('a', { href: URL.createObjectURL(new Blob([text], { type: 'application/json' })), download: suggested });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  state.fileName = suggested; savedOk(suggested + ' (downloaded)');
}
function savedOk(name) { state.dirty = false; $('#dirtyDot').classList.remove('on'); autosave(); toast(`Saved ${name}.`, 'ok'); }
async function saveToAgent() {
  if (!state.hubOk) { toast('No agent connected - start MultiMonitor.ps1 or use “Save”.', 'err'); return; }
  const name = el('input', { class: 'inp', value: slug(config.name), maxlength: 80 });
  const msg = el('div', { class: 'test-result' });
  const go = async () => {
    const n = name.value.trim();
    if (!/^[A-Za-z0-9][A-Za-z0-9 _.-]{0,79}$/.test(n) || n.includes('..')) { msg.className = 'test-result bad'; msg.textContent = '✗ Letters, digits, spaces, dot, dash and underscore only.'; return; }
    try {
      await api(null, '/api/configs/' + encodeURIComponent(n), { method: 'PUT', body: serializeConfig() });
      dlg.close(); state.dirty = false; $('#dirtyDot').classList.remove('on'); autosave(); toast(`Saved to agent as “${n}”.`, 'ok');
    } catch (e) { msg.className = 'test-result bad'; msg.textContent = '✗ ' + e.message; }
  };
  openDialog({ title: 'Save to agent', body: el('form', { onsubmit: e => { e.preventDefault(); go(); } }, field('Name', name, `Stored as configs\\<name>.json next to MultiMonitor.ps1 on ${state.hubInfo.computer}. An existing config with the same name is replaced.`), msg),
    foot: [el('button', { class: 'btn', text: 'Cancel', onclick: () => dlg.close() }), el('button', { class: 'btn primary', text: 'Save', onclick: go })] });
}
async function openFromAgent() {
  if (!state.hubOk) { toast('No agent connected.', 'err'); return; }
  if (!await guardUnsaved()) return;
  const list = el('div', { class: 'cfg-list', text: 'Loading…' });
  openDialog({ title: 'Open from agent', body: list, foot: [el('button', { class: 'btn', text: 'Close', onclick: () => dlg.close() })] });
  try {
    const res = await api(null, '/api/configs');
    if (!res.configs.length) { list.textContent = 'No configs saved on the agent yet.'; return; }
    list.replaceChildren(...res.configs.map(c => el('button', { onclick: async () => {
      try { const obj = await api(null, '/api/configs/' + encodeURIComponent(c.name)); dlg.close(); loadConfigObject(obj, c.name + '.json'); toast(`Opened “${config.name}” from the agent.`, 'ok'); }
      catch (e) { toast(e.message, 'err'); }
    } }, el('span', {}, el('b', { text: c.name })), el('span', { class: 'muted', text: new Date(c.modified).toLocaleString() }))));
  } catch (e) { list.textContent = e.message; }
}
async function newConfig() {
  if (!await guardUnsaved()) return;
  loadConfigObject(defaultConfig());
  toast('Started a new dashboard.', 'info');
}
function fileMenu(anchor) {
  showMenu(anchor, [
    { label: 'New dashboard', icon: 'newfile', run: newConfig },
    { label: 'Open file…', icon: 'open', run: openConfigFile },
    { label: 'Save as…', icon: 'save', run: () => saveConfig(true) },
    '-',
    { label: 'Open from agent…', icon: 'cloudDown', run: openFromAgent },
    { label: 'Save to agent…', icon: 'cloud', run: saveToAgent },
    '-',
    { label: 'Load demo dashboard', icon: 'grid', run: async () => { if (await guardUnsaved()) { loadConfigObject(demoConfig()); } } },
    { label: 'View config JSON', icon: 'file', run: () => openDialog({ title: 'Config JSON', wide: true, body: el('textarea', { class: 'inp mono', rows: 22, readonly: true, style: { width: '100%' } }, serializeConfig()),
      foot: [el('button', { class: 'btn', text: 'Copy', onclick: () => copyText(serializeConfig()) }), el('button', { class: 'btn primary', text: 'Close', onclick: () => dlg.close() })] }) },
  ]);
}

/* ------------------------------------------------------------------ toasts */
function toast(text, kind = 'info') {
  const t = el('div', { class: 'toast ' + kind, role: kind === 'err' ? 'alert' : 'status', html: icon(kind === 'ok' ? 'check' : kind === 'err' ? 'crit' : 'info') }, el('span', { text }));
  $('#toasts').append(t);
  setTimeout(() => t.remove(), kind === 'err' ? 7000 : 3500);
}

/* ------------------------------------------------------------------ wiring */
function wire() {
  $('#btnSide').innerHTML = icon('menu');
  $('#btnSide').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
  $('#btnOpen').innerHTML = icon('open') + '<span>Open</span>';
  $('#btnSave').innerHTML = icon('save') + '<span>Save</span>';
  $('#btnFileMenu').innerHTML = icon('down');
  $('#btnSettings').innerHTML = icon('settings');
  $('#btnOpen').addEventListener('click', openConfigFile);
  $('#btnSave').addEventListener('click', () => saveConfig(false));
  $('#btnFileMenu').addEventListener('click', e => fileMenu(e.currentTarget));
  $('#btnSettings').addEventListener('click', settingsDialog);
  $('#btnPause').addEventListener('click', () => { state.paused = !state.paused; renderTopbar(); if (!state.paused) tick(); });
  $('#btnTheme').addEventListener('click', () => {
    const order = ['auto', 'light', 'dark'];
    config.settings.theme = order[(order.indexOf(config.settings.theme) + 1) % 3];
    applyTheme(); markDirty(); toast(`Theme: ${config.settings.theme === 'auto' ? 'match system' : config.settings.theme}`, 'info');
  });
  const sw = $('#selWindow');
  sw.append(...WINDOWS.map(v => el('option', { value: v, text: v === 60 ? '1 hour' : `${v} min` })));
  sw.addEventListener('change', () => { config.settings.windowMin = +sw.value; markDirty(); renderMain(); });
  const sr = $('#selRefresh');
  sr.append(...REFRESHES.map(v => el('option', { value: v, text: `Every ${v} s` })));
  sr.addEventListener('change', () => { config.settings.refreshSec = +sr.value; markDirty(); restartPolling(); renderMain(); });
  $('#cfgName').addEventListener('input', e => { config.name = e.target.value.slice(0, 80) || 'Dashboard'; document.title = `${config.name} · MultiMonitor`; markDirty(); });

  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveConfig(e.shiftKey); }
    else if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); openConfigFile(); }
    else if (e.key === ' ' && !dlg.open && (document.activeElement === document.body || document.activeElement === $('#main'))) { e.preventDefault(); $('#btnPause').click(); }
  });
  // drag & drop a config file anywhere
  let dragDepth = 0;
  const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  addEventListener('dragenter', e => { if (hasFiles(e)) { dragDepth++; $('#dropOverlay').classList.add('on'); } });
  addEventListener('dragleave', e => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; $('#dropOverlay').classList.remove('on'); } });
  addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  addEventListener('drop', async e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth = 0; $('#dropOverlay').classList.remove('on');
    const f = e.dataTransfer.files[0];
    if (!f) return;
    if (!await guardUnsaved()) return;
    try { loadConfigText(await f.text(), f.name, null); } catch (err) { toast(err.message, 'err'); }
  });
  addEventListener('beforeunload', e => { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleRender(); });
  addEventListener('scroll', () => { const tip = $('#tooltip'); tip.style.display = 'none'; }, { passive: true });
}

async function init() {
  wire();
  let restored = null;
  try { restored = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch { /* ignore */ }
  let startCfg = null;
  if (restored && restored.config) {
    try { startCfg = normalizeConfig(restored.config); state.fileName = restored.fileName || ''; state.dirty = !!restored.dirty; } catch { startCfg = null; }
  }
  config = startCfg || defaultConfig();
  state.view = config.view;
  applyTheme(); renderTopbar(); renderSidebar();
  // Decide live vs demo before the first render so we don't flash a demo banner.
  state.mode = 'live';
  await startHubWatch();
  if (!startCfg && state.mode === 'demo') { config = demoConfig(); state.view = 'overview'; renderTopbar(); renderSidebar(); }
  renderMain();
  restartPolling();
  setInterval(() => { if (!state.paused && !document.hidden) scheduleRender(); }, 1000); // keeps time axes sliding smoothly
}
init();
</script>
</body>
